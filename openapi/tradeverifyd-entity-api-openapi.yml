  /v1/entities/{entity_id}/graph:
    get:
      tags:
      - Entity
      summary: Get Entity Graph
      description: 'Retrieve a graph of paginated relationships for a single Entity.


        This endpoint provides information about the relationships of an Entity,

        such as partnerships, affiliations, or any other defined connections. The

        returned graph contains entity relationship data and includes

        entity properties.


        In the returned relationships data, relationships are described as having

        a `source`, an `target`, and a `type`. The direction of the relationship

        moves from source to target, and is described by the type.


        The page and page_size parameters determine the number of relationships

        to return per page.


        The total_records and total_pages fields are only returned if depth is 3 or less.

        If depth is greater than 3, these fields are omitted.


        Note: This endpoint includes Flags but NOT Risk Events data. Use the

        /risk_events endpoint to retrieve that information for specific entities.'
      operationId: get_entity_graph_entities__entity_id__graph_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          description: Id of the Entity to use as the starting or root entity for graph retrieval.
          title: Entity Id
        description: Id of the Entity to use as the starting or root entity for graph retrieval.
      - name: hs_codes
        in: query
        required: false
        schema:
          description: A comma separated list of 2, 4, or 6-digit HS codes to filter by. A less-specific HS code will always match a more-specific code with the same chapter or heading. For example, code '12' will match '1234' and '1256'. If list is empty or null, all relationships are returned.
          title: Hs Codes
          type: string
          nullable: true
        description: A comma separated list of 2, 4, or 6-digit HS codes to filter by. A less-specific HS code will always match a more-specific code with the same chapter or heading. For example, code '12' will match '1234' and '1256'. If list is empty or null, all relationships are returned.
      - name: depth
        in: query
        required: false
        schema:
          description: Limits how many levels of related relationships the query will explore. For example, a depth of 1 returns only directly related items, while higher values include more distant connections.
          default: 3
          title: Depth
          type: integer
          nullable: true
        description: Limits how many levels of related relationships the query will explore. For example, a depth of 1 returns only directly related items, while higher values include more distant connections.
      - name: page
        in: query
        required: false
        schema:
          description: Page to retrieve
          default: 1
          title: Page
          type: integer
          nullable: true
        description: Page to retrieve
      - name: page_size
        in: query
        required: false
        schema:
          description: Number of relationships to return per page (max 100)
          default: 100
          title: Page Size
          type: integer
          maximum: 100
          minimum: 1
          nullable: true
        description: Number of relationships to return per page (max 100)
      - name: include_affiliates
        in: query
        required: false
        schema:
          description: Set True to preserve affiliate relationships when filtering by HS codes. When True, affiliate relationships will be included in the graph even if they don't match the specified HS codes.
          default: false
          title: Include Affiliates
          type: boolean
          nullable: true
        description: Set True to preserve affiliate relationships when filtering by HS codes. When True, affiliate relationships will be included in the graph even if they don't match the specified HS codes.
      - name: direction
        in: query
        required: false
        schema:
          enum:
          - in
          - out
          type: string
          description: The graph direction from the root entity.  Values are 'in' and 'out'. A typical relationship such as IS_SUPPLIER_OF is an inbound relationship pointing to the root entity. The default value is 'in', resulting in a graph of inbound relationships.
          default: in
