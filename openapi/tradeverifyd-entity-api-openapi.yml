  /v1/entities/{entity_id}/graph/flagged_relationships:
    get:
      tags:
      - Entity
      summary: Get Entity Graph Flagged Relationships
      description: 'Get flagged relationships for an entity with full entity, relationship, and flag details.


        This endpoint returns the shortest paths between the specified entity and all

        upstream flagged entities that pass through the provided HS codes. The response

        includes complete details for all entities, relationships, and flags referenced

        in the paths.


        Args:

        - entity_id: The ID of the entity to use as the starting point for relationship search

        - hs_codes: List of HS codes that paths must pass through to be considered

        - include_flags: Optional list of flag types to filter by (if not provided, all flag types are considered)

        - include_affiliates: When True, paths connected by affiliate relationships are included

        - paging: Pagination parameters


        Returns:

        - FlaggedRelationshipsResponse: Contains entities, relationships, and flags with all

        ObjectIds serialized as strings with all ObjectIds serialized as strings'
      operationId: get_entity_graph_flagged_relationships_entities__entity_id__graph_flagged_relationships_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      - name: hs_codes
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          title: Hs Codes
      - name: include_flags
        in: query
        required: false
        schema:
          title: Include Flags
          type: array
          items:
            type: string
          nullable: true
      - name: include_affiliates
        in: query
        required: false
        schema:
          description: Set True to preserve affiliate relationships when filtering by HS codes. When True, affiliate relationships will be included in the graph even if they don't match the specified HS codes.
          default: false
          title: Include Affiliates
          type: boolean
          nullable: true
        description: Set True to preserve affiliate relationships when filtering by HS codes. When True, affiliate relationships will be included in the graph even if they don't match the specified HS codes.
      - name: page
        in: query
        required: false
        schema:
          default: 1
          title: Page
          type: integer
          nullable: true
      - name: page_size
        in: query
        required: false
        schema:
          default: 25
          title: Page Size
          type: integer
          nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlaggedRelationshipsResponse'
        '500':
          description: Internal server error - contact support
          content:
            application/json:
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    detail: Internal server error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
