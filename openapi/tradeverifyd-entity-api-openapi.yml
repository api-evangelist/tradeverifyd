  /v1/entities/{identifier_type}/{identifier_value}/verification:
    get:
      tags:
      - Entity
      summary: Get Entity Verification by identifier
      description: 'Retrieves a Tradeverifyd Supplier Assesssment (TSA) for an entity from alternative identifiers.

        The purpose of this endpoint is to use external IDs (such as manufacturing or bank identifiers) to

        retrieve entity verification details in the form of a TSA.


        For example:

        - Retrieving by LEI id: `GET /v1/entities/lei/559312VRR0Z0AXO77J92/verification`

        - Retrieving by BIC id: `GET /v1/entities/bic/XCDVTLBIXXX/verification`'
      operationId: get_entity_verification_details_by_identifier_entities__identifier_type___identifier_value__verification_get
      parameters:
      - name: identifier_type
        in: path
        required: true
        schema:
          type: string
          description: The type of the identifier (e.g., lei, mid)
          title: Identifier Type
        description: The type of the identifier (e.g., lei, mid)
      - name: identifier_value
