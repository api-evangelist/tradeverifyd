          description: 'Members of ''source'' field that are also well-formed URLs. If Flag.source

            has 1 or more entries, but none are valid URLs, the value of this

            computed field will be None.'
          readOnly: true
          items:
            type: string
          type: array
          nullable: true
      additionalProperties: true
      type: object
      required:
      - entity_id
      - type
      - url_sources
      title: Flag
      description: "Represents a flag associated with a particular entity.\n\nA flag is positive if, for example, the entity it is associated with has\nbeen certified by an authoritative body to be in compliance with an accepted\nstandard. It is negative if the associated entity participates in or is\nassociated with a sanctioned, illegal, or otherwise undesirable activity.\n\nAttributes:\n    id: Database id of the record, corresponds to mongodb '_id'.\n\n    entity_id: Database id of the entity the flag is applied to, corresponds\n    to target entity '_id' in mongodb.\n\n    schema_version: Document schema.\n\n    type: Details about the nature of the flag. This may be the name of the\n    relevant certification or sanction, e.g. 'RSPO Certified' or 'ITAR\n    Debarred (DTC) - State Department', or a more general category, e.g.\n    'forced labor'. This should be an ObjectIdField stored in the 'flag_types'\n    collection - optionally a string allowed here for validation when the ObjectId\n    field needs to be looked up and displayed in the portal.\n\n    tags: A list of semi-arbitrary strings that provides additional\n    classifications or detail on the nature of the flag type. An example of\n    this might be a flag with type \"Forced Labor Risk\" with subtype\n    \"Operating in Uyghur Region\", \"Sourcing directly from Uyghur Region\", or\n    \"Accepted labor transfers outside Uyghur Region\".\n\n    source: List of ONE url to a page containing information that is\n    relevant to the flag, or the entity it applies to. For user-uploaded\n    flags, this field will be None.\n\n    entity_jurisdiction: ISO country code of the entity that the flag\n    applies to, if the jurisdiction is known.\n\n    customer_managed: This field is true if a customer has created this flag\n    directly, otherwise, it is false. A customer-managed flag MUST NOT be\n    visible outside of the organization of the user who created it.\n\n    owner_email: The email address of the user who created the\n    customer-managed flag. If 'customer_managed' is false, this field MUST\n    be None.\n\n    organization: The globally-unique name of the organization to which a\n    customer-managed flag belongs, which is currently the same as the\n    organization to which the flag's creator belongs. If 'customer_managed'\n    if false, this field MUST be None.\n\n    is_positive: A derived field not present on the underlying record. This\n    field controls whether the flag is displayed to users as a 'positive' or\n    'negative' flag.\n\n    deleted: Whether or not the flag is currently in-force.\n\n    deleted_at: If the flag is no longer in force for any reason, this field\n    is the time the flag ceased to be applicable to the target entity.\n\n    deletion_source: If 'deleted_at' is not null, this field explains why\n    the flag is no longer in effect. It may be a URL to a web source\n    offering further explanation.\n\n    confidence: For flag records generated by bots, this field indicates the\n    strength of our belief that the decision to assign a flag is correct.\n    100 is the most confident, 0 is the least. If a flag was not generated\n    by a bot, this field must be None.\n\n    time_start: Time at which flag took effect. Currently, this field is\n    only set on Flags uploaded via Earthstream API.\n\n    time_end: Time after which flag is no longer in effect. Currently, this\n    field is only set on Flags uploaded via Earthstream API.\n\n    description: Plain-text description for the flag. Currently, this field\n    is only set on Flags uploaded via Earthstream API.\n\n    # TODO: TV-10497 Remove this field, as the default is set to 0.5, which is being nullified\n    # in GraphEntity.entity_score. This might be important for risk events, but not for Flags.\n    score: The score of the flag.\n\n    decay_factor: The amount by which a flag decays, which is re-calculated daily according to\n    the flag's decay strategy and the flag's age. This gets factored into an entity's score\n    through the TradeverifydScoringService later on, through the regulatory flag strategy. The\n    decay_factor should always be a float between 0 and 1, but for soft deleted flags, it will\n    be set to 1.0 as to not impact the entity's score.\n\n    decay_version: The version of the decay strategy used to calculate the decay_factor.\n\n    penalties: A optional list of dictionaries, each containing the following keys:\n    - penalty_agency: The agency that issued the penalty\n    - penalty_usd: The amount of the penalty in USD\n    - penalty_date: The date of the penalty"
