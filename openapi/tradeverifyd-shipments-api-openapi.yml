components:
  schemas:
    UpdateShipmentRequest:
      properties:
        shipment_name:
          type: string
          title: Shipment Name
          description: Name of shipment.
        origin:
          title: Origin
          description: Location of the shipment's origin.
          type: string
          nullable: true
        destination:
          title: Destination
          description: Location of the shipment's destination.
          type: string
          nullable: true
        departure_date:
          title: Departure Date
          description: Date of the shipment's departure.
          type: string
          format: date-time
          nullable: true
        arrival_date:
          title: Arrival Date
          description: Date of the shipment's arrival.
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        active:
          type: boolean
          title: Active
          description: Boolean signifying if the shipment is active or inactive.
          default: true
        organizational_units:
          items:
            type: string
          type: array
          title: Organizational Units
          description: Subunit(s) of the organization.
        detention_id:
          title: Detention Id
          description: Databaes ID of the detention for the shipment, if applicable.
          type: string
          nullable: true
      type: object
      required:
      - shipment_name
      - status
      - organizational_units
      title: UpdateShipmentRequest
      description: Model for updating a shipment.
    ShipmentResponse:
      properties:
        shipment_id:
          type: string
          format: uuid
          title: Shipment Id
          description: Shipment identifier.
        shipment_name:
          type: string
          title: Shipment Name
          description: Name of shipment.
        organization:
          type: string
          title: Organization
          description: Organization to which the shipment belongs.
        organizational_units:
          title: Organizational Units
          description: Optional field for subunits of the organization.
          items:
            type: string
          type: array
          nullable: true
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        active:
          type: boolean
          title: Active
          description: Boolean signifying if the shipment is active or inactive.
        created:
          title: Created
          description: Date when the shipment record was created.
          type: string
          format: date-time
          nullable: true
        last_modified:
          title: Last Modified
          description: Date when the shipment record was last modified.
          type: string
          format: date-time
          nullable: true
      type: object
      required:
      - shipment_id
