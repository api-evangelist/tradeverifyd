        schema:
          default: []
          title: Supplier Name
          type: array
          items:
            type: string
          nullable: true
      - name: supplier_jurisdiction
        in: query
        required: false
        schema:
          default: []
          title: Supplier Jurisdiction
          type: array
          items:
            type: string
          nullable: true
      - name: tradeverifyd_score
        in: query
        required: false
        schema:
          default: []
          title: Tradeverifyd Score
          type: array
          items:
            type: string
          nullable: true
      - name: status
        in: query
        required: false
        schema:
          default: []
          title: Status
          type: array
          items:
            type: string
          nullable: true
      - name: page
        in: query
        required: false
        schema:
