  /v1/credentials/schemas/{schema_name}:
    get:
      tags:
      - Verifiable Credentials
      summary: Get schema by name
      description: Get schema by name
      operationId: get_schema_by_name_credentials_schemas__schema_name__get
      parameters:
      - name: schema_name
        in: path
        required: true
        schema:
          type: string
          description: The name of the schema to retrieve
          title: Schema Name
        description: The name of the schema to retrieve
      responses:
        '200':
          description: Credential schema definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSchema'
              examples:
                iti_credential_schema:
                  summary: Intent To Import (ITI) Credential Schema
                  description: JSON Schema for ITI credentials submitted to US Customs for import trade documentation compliance
                  value:
                    $id: https://app.tradeverifyd.example/templates/urn:tradeverifyd:template:iti-credential
                    title: Intent To Import Credential Schema
                    description: Schema for Intent To Import verifiable credentials containing trade documentation for US Customs submission
                    type: object
                    properties:
                      '@context':
                        type: array
                        items:
                          type: string
                        description: JSON-LD context for the credential
                      type:
                        type: array
                        items:
                          type: string
                        description: Credential type array
                      issuer:
                        type: string
                        description: DID of the credential issuer
                      credentialSubject:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Subject identifier
                          type:
                            type: string
                            enum:
                            - ITI
                          shipment_id:
                            type: string
                            description: Associated shipment ID
                          customs_entry_number:
                            type: string
                            description: CBP entry number
                          importer:
                            type: object
                            properties:
                              name:
                                type: string
                              address:
                                type: string
                              ein:
                                type: string
                            required:
                            - name
                            - address
                          products:
                            type: array
                            items:
                              type: object
                              properties:
                                description:
                                  type: string
                                hs_code:
                                  type: string
                                quantity:
                                  type: number
                                value:
                                  type: number
                              required:
                              - description
                              - hs_code
                              - quantity
                              - value
                        required:
                        - id
                        - type
                        - shipment_id
                        - importer
                        - products
                    additionalProperties: false
                    required:
                    - '@context'
                    - type
                    - issuer
                    - credentialSubject
                    example: Example ITI credential structure for electronics import
                bill_of_lading_schema:
                  summary: Bill of Lading Credential Schema
                  description: JSON Schema for Bill of Lading credentials used in international shipping documentation
                  value:
                    $id: https://app.tradeverifyd.example/templates/urn:tradeverifyd:template:bill-of-lading
                    title: Bill of Lading Credential Schema
                    description: Schema for Bill of Lading verifiable credentials for international shipping
                    type: object
                    properties:
                      '@context':
                        type: array
                        items:
                          type: string
                        description: JSON-LD context for the credential
                      type:
                        type: array
                        items:
                          type: string
                        description: Credential type array
                      issuer:
                        type: string
                        description: DID of the credential issuer (typically carrier)
                      credentialSubject:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Subject identifier
                          type:
                            type: string
                            enum:
                            - BillOfLading
                          shipment_id:
                            type: string
                            description: Associated shipment ID
                          bill_of_lading_number:
                            type: string
                            description: Unique B/L number
                          carrier:
                            type: object
                            properties:
                              name:
                                type: string
                              scac:
                                type: string
                                description: Standard Carrier Alpha Code
                            required:
                            - name
                            - scac
                          shipper:
                            type: object
                            properties:
                              name:
                                type: string
                              address:
                                type: string
                            required:
                            - name
                            - address
                          consignee:
                            type: object
                            properties:
                              name:
                                type: string
                              address:
                                type: string
                            required:
                            - name
                            - address
                          port_of_loading:
                            type: string
                            description: Origin port
                          port_of_discharge:
                            type: string
                            description: Destination port
                          vessel_name:
                            type: string
                            description: Ship name
                          voyage_number:
                            type: string
                            description: Voyage identifier
                        required:
                        - id
                        - type
                        - shipment_id
                        - bill_of_lading_number
                        - carrier
                        - shipper
                        - consignee
                    additionalProperties: false
                    required:
                    - '@context'
                    - type
                    - issuer
                    - credentialSubject
                    example: Example Bill of Lading credential for ocean freight
                certificate_origin_schema:
                  summary: Certificate of Origin Schema
                  description: JSON Schema for Certificate of Origin credentials used to certify the country where goods were manufactured
                  value:
                    $id: https://app.tradeverifyd.example/templates/urn:tradeverifyd:template:certificate-of-origin
                    title: Certificate of Origin Schema
                    description: Schema for Certificate of Origin verifiable credentials
                    type: object
                    properties:
                      '@context':
                        type: array
                        items:
                          type: string
                        description: JSON-LD context
                      type:
                        type: array
                        items:
                          type: string
                        description: Credential types
                      issuer:
                        type: string
                        description: DID of issuing chamber of commerce or authority
                      credentialSubject:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Subject identifier
                          type:
                            type: string
                            enum:
                            - CertificateOfOrigin
                          shipment_id:
                            type: string
                            description: Associated shipment ID
                          country_of_origin:
                            type: string
                            description: ISO 3166-1 alpha-2 country code
                          manufacturer:
                            type: object
                            properties:
                              name:
                                type: string
                              address:
                                type: string
                              registration_number:
                                type: string
                            required:
                            - name
                            - address
                          goods:
                            type: array
                            items:
                              type: object
                              properties:
                                description:
                                  type: string
                                hs_code:
                                  type: string
                                quantity:
                                  type: number
                                gross_weight:
                                  type: number
                              required:
                              - description
                              - hs_code
                              - quantity
                          attestation:
                            type: object
                            properties:
                              issuer:
                                type: string
                                description: Attesting authority
                              date:
                                type: string
                                format: date
                              certificate_number:
                                type: string
                            required:
                            - issuer
                            - date
                            - certificate_number
                        required:
                        - id
                        - type
                        - shipment_id
                        - country_of_origin
                        - manufacturer
                        - goods
                        - attestation
                    additionalProperties: false
                    required:
                    - '@context'
                    - type
                    - issuer
                    - credentialSubject
                    example: Example Certificate of Origin for manufactured goods
        '404':
          description: Schema not found
          content:
            application/json:
              examples:
                schema_not_found:
                  summary: Schema not found
                  value:
                    detail: Schema not found.
