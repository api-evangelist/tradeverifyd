aid: tradeverifyd
name: Tradeverifyd
description: >-
  Tradeverifyd is a supply chain intelligence platform, formed by the
  combination of Transmute and mesur.io and backed by Techstars, that screens
  suppliers against 200+ global data sources, maps multi-tier supplier
  relationship graphs, monitors global risk events, and issues W3C Verifiable
  Credentials that can be presented to US Customs (CBP). Its coverage spans
  UFLPA, EU CSDDD, UK Modern Slavery Act, OFAC, EU/UN sanctions, NDAA, and
  EUDR. The v1 REST API exposes entity search and resolution, relationship
  graphs, flags, risk events, reports, shipments, supplier information
  requests, and verifiable-credential issuance, authenticated with an
  ocp-apim-subscription-key header.
